# Builds Dustling.dmg. A pushed version tag (v1.2.3) also creates a draft GitHub release with it.
# Pull requests and manual runs only build, so a broken release build shows up before a tag does.
# docs/RELEASING.md describes the whole process.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    paths:
      - "App/**"
      - "Sources/**"
      - "Package.swift"
      - "CHANGELOG.md"
      - "scripts/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Dustling.dmg
    # Xcode 26 or later is needed for the Icon Composer app icon.
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the changelog has notes for this version
        if: steps.version.outputs.version != ''
        run: scripts/release-notes.sh "${{ steps.version.outputs.version }}" > /dev/null

      - name: Show Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run the tests
        run: swift test

      - name: Build the disk image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-dmg.sh ${VERSION:+--version "$VERSION"}

      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: .build/release-app/xcodebuild.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Dustling-dmg
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create the draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: Dustling-dmg
          path: dist

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          scripts/release-notes.sh "$VERSION" dist/Dustling.dmg.sha256 > notes.md
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)

          if gh release view "$TAG" > /dev/null 2>&1; then
            if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "::error::$TAG is already published. Delete it on GitHub first if it really needs rebuilding."
              exit 1
            fi
            gh release edit "$TAG" --notes-file notes.md --title "Dustling $VERSION"
            gh release upload "$TAG" dist/Dustling.dmg dist/Dustling.dmg.sha256 --clobber
          else
            gh release create "$TAG" dist/Dustling.dmg dist/Dustling.dmg.sha256 \
              --draft --verify-tag "${prerelease[@]}" \
              --title "Dustling $VERSION" --notes-file notes.md
          fi
          echo "Draft release ready: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
